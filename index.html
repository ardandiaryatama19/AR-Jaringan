<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Perangkat Jaringan - SMK</title>
    <!-- Library A-Frame dan MindAR -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden">
    <a-scene
      embedded
      mindar-image="imageTargetSrc: targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <!-- Daftar Asset 3D .glb -->
        <a-asset-item id="switchModel" src="switch.glb"></a-asset-item>
        <a-asset-item id="routerModel" src="router.glb"></a-asset-item>
        <a-asset-item id="modemModel" src="modem.glb"></a-asset-item>
        <a-asset-item id="apModel" src="access_point.glb"></a-asset-item>
        <a-asset-item id="utpModel" src="kabel_utp_stp.glb"></a-asset-item>
        <a-asset-item
          id="nicModel"
          src="network_interface_card.glb"
        ></a-asset-item>
        <a-asset-item id="hubModel" src="hub.glb"></a-asset-item>
        <a-asset-item id="fiberModel" src="kabel_fiber.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0: Switch -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model
          src="#switchModel"
          position="0 0 0"
          scale="0.5 0.5 0.5"
          rotation="0 180 0"
        ></a-gltf-model>
      </a-entity>

      <!-- Target 1: Router -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model
          src="#routerModel"
          position="0 0 0"
          scale="0.5 0.5 0.5"
          rotation="0 180 0"
        ></a-gltf-model>
      </a-entity>

      <!-- Target 2: Modem -->
      <a-entity mindar-image-target="targetIndex: 2">
        <a-gltf-model
          src="#modemModel"
          position="0 0 0"
          scale="0.5 0.5 0.5"
          rotation="0 180 0"
        ></a-gltf-model>
      </a-entity>

      <!-- Target 3: Access Point -->
      <a-entity mindar-image-target="targetIndex: 3">
        <a-gltf-model
          src="#apModel"
          position="0 0 0"
          scale="0.5 0.5 0.5"
          rotation="0 180 0"
        ></a-gltf-model>
      </a-entity>

      <!-- Target 4: Kabel UTP/STP -->
      <a-entity mindar-image-target="targetIndex: 4">
        <a-gltf-model
          src="#utpModel"
          position="0 0 0"
          scale="0.5 0.5 0.5"
          rotation="0 180 0"
        ></a-gltf-model>
      </a-entity>

      <!-- Target 5: Network Interface Card (NIC) -->
      <a-entity mindar-image-target="targetIndex: 5">
        <a-gltf-model
          src="#nicModel"
          position="0 0 0"
          scale="0.5 0.5 0.5"
          rotation="0 180 0"
        ></a-gltf-model>
      </a-entity>

      <!-- Target 6: Hub -->
      <a-entity mindar-image-target="targetIndex: 6">
        <a-gltf-model
          src="#hubModel"
          position="0 0 0"
          scale="0.5 0.5 0.5"
          rotation="0 180 0"
        ></a-gltf-model>
      </a-entity>

      <!-- Target 7: Kabel Fiber -->
      <a-entity mindar-image-target="targetIndex: 7">
        <a-gltf-model
          src="#fiberModel"
          position="0 0 0"
          scale="0.5 0.5 0.5"
          rotation="0 180 0"
        ></a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
