<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Perangkat Jaringan - SMK</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      .ar-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #status {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 9999;
        background: rgba(0, 0, 0, 0.7);
        color: #0f0;
        font: 12px monospace;
        padding: 6px;
        white-space: pre-wrap;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="status">menunggu...</div>

    <div class="ar-container">
      <a-scene
        mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 3;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        embedded
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
      >
        <a-assets>
          <a-asset-item id="switchModel" src="./switch.glb"></a-asset-item>
          <a-asset-item id="routerModel" src="./router.glb"></a-asset-item>
          <a-asset-item id="modemModel" src="./modem.glb"></a-asset-item>
          <a-asset-item id="apModel" src="./access_point.glb"></a-asset-item>
          <a-asset-item id="utpModel" src="./kabel_utp_stp.glb"></a-asset-item>
          <a-asset-item
            id="nicModel"
            src="./network_interface_card.glb"
          ></a-asset-item>
          <a-asset-item id="hubModel" src="./hub.glb"></a-asset-item>
          <a-asset-item id="fiberModel" src="./kabel_fiber.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Index 0 -->
        <a-entity mindar-image-target="targetIndex: 0">
          <a-box color="red" scale="0.1 0.1 0.1" position="0 0 0"></a-box>
          <a-gltf-model
            src="#switchModel"
            position="0 0 0"
            scale="0.5 0.5 0.5"
            rotation="0 180 0"
          ></a-gltf-model>
        </a-entity>

        <!-- Index 1 -->
        <a-entity mindar-image-target="targetIndex: 1">
          <a-box color="red" scale="0.1 0.1 0.1" position="0 0 0"></a-box>
          <a-gltf-model
            src="#routerModel"
            position="0 0 0"
            scale="0.5 0.5 0.5"
            rotation="0 180 0"
          ></a-gltf-model>
        </a-entity>

        <!-- Index 2 -->
        <a-entity mindar-image-target="targetIndex: 2">
          <a-box color="red" scale="0.1 0.1 0.1" position="0 0 0"></a-box>
          <a-gltf-model
            src="#modemModel"
            position="0 0 0"
            scale="0.5 0.5 0.5"
            rotation="0 180 0"
          ></a-gltf-model>
        </a-entity>

        <!-- Index 3 -->
        <a-entity mindar-image-target="targetIndex: 3">
          <a-box color="red" scale="0.1 0.1 0.1" position="0 0 0"></a-box>
          <a-gltf-model
            src="#apModel"
            position="0 0 0"
            scale="0.5 0.5 0.5"
            rotation="0 180 0"
          ></a-gltf-model>
        </a-entity>

        <!-- Index 4 -->
        <a-entity mindar-image-target="targetIndex: 4">
          <a-box color="red" scale="0.1 0.1 0.1" position="0 0 0"></a-box>
          <a-gltf-model
            src="#utpModel"
            position="0 0 0"
            scale="0.5 0.5 0.5"
            rotation="0 180 0"
          ></a-gltf-model>
        </a-entity>

        <!-- Index 5 -->
        <a-entity mindar-image-target="targetIndex: 5">
          <a-box color="red" scale="0.1 0.1 0.1" position="0 0 0"></a-box>
          <a-gltf-model
            src="#nicModel"
            position="0 0 0"
            scale="0.5 0.5 0.5"
            rotation="0 180 0"
          ></a-gltf-model>
        </a-entity>

        <!-- Index 6 -->
        <a-entity mindar-image-target="targetIndex: 6">
          <a-box color="red" scale="0.1 0.1 0.1" position="0 0 0"></a-box>
          <a-gltf-model
            src="#hubModel"
            position="0 0 0"
            scale="0.5 0.5 0.5"
            rotation="0 180 0"
          ></a-gltf-model>
        </a-entity>

        <!-- Index 7 -->
        <a-entity mindar-image-target="targetIndex: 7">
          <a-box color="red" scale="0.1 0.1 0.1" position="0 0 0"></a-box>
          <a-gltf-model
            src="#fiberModel"
            position="0 0 0"
            scale="0.5 0.5 0.5"
            rotation="0 180 0"
          ></a-gltf-model>
        </a-entity>
      </a-scene>
    </div>

    <script>
      const st = document.getElementById("status");
      const log = (m) => {
        st.textContent += "\n" + m;
      };

      window.addEventListener("load", () => {
        const scene = document.querySelector("a-scene");

        document.querySelectorAll("[mindar-image-target]").forEach((el, i) => {
          el.addEventListener("targetFound", () =>
            log("TARGET DITEMUKAN: index " + i),
          );
          el.addEventListener("targetLost", () =>
            log("target hilang: index " + i),
          );
        });

        document.querySelectorAll("a-gltf-model").forEach((m) => {
          const name = m.getAttribute("src");
          m.addEventListener("model-loaded", () => log("model OK: " + name));
          m.addEventListener("model-error", () => log("MODEL GAGAL: " + name));
        });

        scene.addEventListener("arReady", () =>
          log("AR siap, arahkan ke marker"),
        );
        scene.addEventListener("arError", () =>
          log("AR ERROR (cek izin kamera / targets.mind)"),
        );
      });
    </script>
  </body>
</html>
